# PostgreSQL local para EcoRAEE Cloud (equivale a Amazon RDS PostgreSQL de la Parte I).
# Al primer arranque ejecuta automáticamente database/01_schema.sql y 02_seed.sql.
#   docker compose up -d        -> levantar
#   docker compose down -v      -> borrar todo y volver a los datos de prueba
services:
  db:
    image: postgres:16
    container_name: ecoraee-db
    environment:
      POSTGRES_DB: ecoraee
      POSTGRES_USER: ecoraee
      POSTGRES_PASSWORD: ecoraee123
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - ecoraee_pgdata:/var/lib/postgresql/data

volumes:
  ecoraee_pgdata:
