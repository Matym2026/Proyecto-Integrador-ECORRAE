services:
  db:
    image: postgres:16
    container_name: ecoraee-db
    environment:
      POSTGRES_DB: ecoraee
      POSTGRES_USER: ecoraee
      POSTGRES_PASSWORD: ecoraee123
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - ecoraee_pgdata:/var/lib/postgresql/data

volumes:
  ecoraee_pgdata:
